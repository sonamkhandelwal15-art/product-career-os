<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Career OS · 52-Week Build</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --ink:#0B0E13; --panel:#141A22; --panel2:#1B2330; --line:#27313F;
  --text:#E9E6DD; --dim:#9AA6B5; --faint:#6B7787;
  --gold:#E0B84C; --cyan:#69B9C8; --green:#82BE8D; --red:#E5645D; --violet:#A78BD0;
  --disp:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2B3746;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:#0E131A;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.2px;padding:0 8px 4px}
.brand span{color:var(--gold)}
.brandsub{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;padding:0 8px 18px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--dim);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left;margin-bottom:2px}
.navbtn:hover{background:#161D27;color:var(--text)}
.navbtn.on{background:#1C2532;color:var(--text);box-shadow:inset 2px 0 0 var(--gold)}
.navbtn i{font-style:normal;font-size:13px;width:16px;text-align:center;opacity:.85}
.navsec{font-family:var(--mono);font-size:9px;color:#4E5A6B;letter-spacing:.16em;text-transform:uppercase;padding:16px 10px 6px}
.main{padding:26px 32px 90px;max-width:1180px}

/* ---------- type ---------- */
h1{font-family:var(--disp);font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.4px}
h2{font-family:var(--disp);font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:-.2px}
h3{font-family:var(--disp);font-size:14px;font-weight:600;margin:0 0 6px}
.lede{color:var(--dim);font-size:13.5px;margin:0 0 22px;max-width:74ch}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.mono{font-family:var(--mono)}
.muted{color:var(--dim)}
.tiny{font-size:11.5px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g2,.g3,.g4{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{position:static;height:auto}}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--gold);line-height:1.1}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.stat .s{font-size:11.5px;color:var(--dim);margin-top:4px}

.meter{display:flex;gap:2px;margin-top:10px}
.meter i{flex:1;height:6px;background:#212B38;border-radius:2px}
.meter i.f{background:var(--gold)}
.meter i.h{background:#6E5E31}

/* ---------- chips/badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:#111823}
.chip.gold{color:var(--gold);border-color:#4A3D18}
.chip.cyan{color:var(--cyan);border-color:#1F4650}
.chip.green{color:var(--green);border-color:#27452C}
.chip.red{color:var(--red);border-color:#4E2724}
.chip.violet{color:var(--violet);border-color:#3D3352}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}

/* ---------- buttons ---------- */
.btn{background:#1E2836;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:.15s}
.btn:hover{background:#25313F;border-color:#3A4759}
.btn.pri{background:var(--gold);color:#161206;border-color:var(--gold);font-weight:600}
.btn.pri:hover{background:#EFC85C}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- inputs ---------- */
input,select,textarea{background:#0F151D;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:13px;width:100%}
textarea{resize:vertical;line-height:1.6}
input:focus,select,textarea:focus{outline:none;border-color:#3E4C60}
label.f{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.field{margin-bottom:12px}

/* ---------- week cards ---------- */
.qtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.qtab{background:#141A22;border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12.5px}
.qtab.on{background:#1F2937;color:var(--text);border-color:#3B4A5E}
.qtab b{color:var(--gold);font-family:var(--mono);font-size:11px;margin-right:6px}

.wk{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
.wk.done{border-color:#2C4632;background:#131A16}
.wk.now{border-color:#5C4C1E;box-shadow:0 0 0 1px #3A310F}
.wkhead{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
.wkhead:hover{background:#171E28}
.wknum{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.1em;min-width:52px}
.wktitle{font-family:var(--disp);font-size:13.5px;font-weight:600;flex:1}
.wk.done .wktitle{color:var(--green)}
.wkdate{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.wkbody{display:none;padding:2px 15px 16px;border-top:1px solid var(--line)}
.wk.open .wkbody{display:block}
.wksec{margin-top:14px}
.wksec .kicker{margin-bottom:6px}
ul.t{margin:0;padding-left:17px}
ul.t li{margin-bottom:4px;color:var(--dim);font-size:12.5px}
ul.t li b{color:var(--text);font-weight:600}
.res{display:flex;flex-direction:column;gap:5px}
.res a{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:6px 9px;background:#0F151D;border:1px solid var(--line);border-radius:7px}
.res a:hover{border-color:#3A4759;text-decoration:none}
.res a .src{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);min-width:70px}
.res a .ti{color:var(--text);flex:1}
.box{background:#0F151D;border:1px solid var(--line);border-left:2px solid var(--cyan);border-radius:7px;padding:11px 13px;font-size:12.5px;color:var(--dim)}
.box.gold{border-left-color:var(--gold)}
.box.green{border-left-color:var(--green)}
.box b{color:var(--text)}

/* ---------- case cards ---------- */
.case{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;display:flex;flex-direction:column;gap:9px}
.case:hover{border-color:#3A4759}
.case h3{margin:0}
.case p{margin:0;font-size:12.5px;color:var(--dim)}

/* ---------- score ---------- */
.sc{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.sc .dim{font-size:12px;min-width:150px;color:var(--dim)}
.sc .bar{flex:1;height:7px;background:#212B38;border-radius:4px;overflow:hidden}
.sc .bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.sc .v{font-family:var(--mono);font-size:11px;color:var(--gold);min-width:30px;text-align:right}
.verdict{font-family:var(--disp);font-size:18px;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:9px 10px;border-bottom:1px solid #1E2734;color:var(--dim);vertical-align:top}
td b{color:var(--text)}
tr:hover td{background:#161D27}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow-y:auto;padding-right:6px;margin-bottom:14px}
.msg{padding:11px 14px;border-radius:10px;font-size:13px;max-width:88%}
.msg.u{background:#1E2836;align-self:flex-end}
.msg.a{background:#111822;border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap}
.typing{font-family:var(--mono);font-size:11px;color:var(--gold)}

.hidden{display:none!important}
.divider{height:1px;background:var(--line);margin:20px 0}
.pill{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;background:#0F151D;border:1px solid var(--line);color:var(--dim)}
footer.note{margin-top:26px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px;max-width:80ch}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">PRODUCT CAREER <span>OS</span></div>
    <div class="brandsub">52-week build · app</div>
    <div class="navsec">Operate</div>
    <button class="navbtn on" data-page="dash"><i>◈</i>Mission Control</button>
    <button class="navbtn" data-page="plan"><i>▤</i>52-Week Plan</button>
    <button class="navbtn" data-page="cases"><i>◇</i>Case Vault</button>
    <div class="navsec">Build</div>
    <button class="navbtn" data-page="studio"><i>⬡</i>Artifact Studio</button>
    <button class="navbtn" data-page="portfolio"><i>▣</i>Portfolio</button>
    <div class="navsec">Convert</div>
    <button class="navbtn" data-page="interview"><i>◎</i>Interview Range</button>
    <button class="navbtn" data-page="coach"><i>✦</i>Coach</button>
    <button class="navbtn" data-page="data"><i>⚙</i>Setup &amp; Data</button>
  </nav>
  <main class="main" id="main"></main>
</div>
<script>
/* ============ REFERENCE LIBRARY (verified links) ============ */
const R = {
  swag:   ['Swag Wala PM','https://www.youtube.com/c/TheSwagWalaPM'],
  swagFull:['Swag Wala PM','https://www.youtube.com/watch?v=WNdwk-s2GNU'],
  swagDisc:['Swag Wala PM','https://www.youtube.com/watch?v=CWhwIt-tZWU'],
  swagFP: ['Swag Wala PM','https://www.youtube.com/watch?v=Z0SZcbbyu9c'],
  swagSec:['Swag Wala PM','https://www.youtube.com/watch?v=8_hcBBUUvCg'],
  swagRoad:['Swag Wala PM','https://www.youtube.com/watch?v=pka0R2KnzdA'],
  swagRoles:['Swag Wala PM','https://www.youtube.com/watch?v=ldjWOb4rAOo'],
  swagMBA:['Swag Wala PM','https://www.youtube.com/watch?v=qgEyMHXPWUs'],
  rethink:['Rethink Systems','https://recorded.rethinksystems.in/'],
  lenny:  ['Lenny\u2019s Podcast','https://www.youtube.com/@LennysPodcast'],
  lennyN: ['Lenny\u2019s Newsletter','https://www.lennysnewsletter.com/podcast'],
  aakash: ['Aakash Gupta','https://www.youtube.com/@growproduct'],
  aakashN:['Product Growth','https://www.news.aakashg.com/'],
  aakashSite:['Aakash Gupta','https://www.aakashg.com/'],
  expo:   ['Exponent','https://www.youtube.com/c/ExponentTV/videos'],
  expoQ:  ['Exponent','https://www.tryexponent.com/blog/top-product-manager-interview-questions'],
  expoPlan:['Exponent','https://www.tryexponent.com/blog/the-ultimate-pm-interview-study-plan'],
  expoC:  ['Exponent','https://www.tryexponent.com/courses'],
  diego:  ['PM Diego Granados','https://www.youtube.com/channel/UCzpDM7pbVBxV1WwjYux0Ixw'],
  folks:  ['The Product Folks','https://www.theproductfolks.com/learn-product-management'],
  sql1:   ['DataLemur','https://datalemur.com/sql-tutorial/intro-to-sql'],
  sql2:   ['DataLemur','https://datalemur.com/sql-tutorial/intermediate-data-science-sql-intro'],
  sql3:   ['DataLemur','https://datalemur.com/sql-tutorial/advanced-sql-tutorial-intro'],
  sqlQ:   ['DataLemur','https://datalemur.com/questions'],
  mode:   ['Mode','https://mode.com/resources/']
};
// topical search inside a channel — always resolves, never a dead deep-link
function sw(q){ return ['Swag Wala PM \u00b7 search','https://www.youtube.com/c/TheSwagWalaPM/search?query='+encodeURIComponent(q)]; }
function ln(q){ return ['Lenny \u00b7 search','https://www.youtube.com/@LennysPodcast/search?query='+encodeURIComponent(q)]; }
function ak(q){ return ['Aakash \u00b7 search','https://www.youtube.com/@growproduct/search?query='+encodeURIComponent(q)]; }
function ex(q){ return ['Exponent \u00b7 search','https://www.youtube.com/c/ExponentTV/search?query='+encodeURIComponent(q)]; }

/* ============ 52-WEEK CURRICULUM ============ */
const QUARTERS = [
  {q:1,name:'Foundations, Rebuilt',sub:'Product thinking + the analytics spine you are missing',weeks:'1\u201313'},
  {q:2,name:'Growth & Experimentation',sub:'Loops, retention, pricing, tests \u2014 the Growth PM core',weeks:'14\u201326'},
  {q:3,name:'AI & Technical Fluency',sub:'Stack literacy, AI product patterns, shipped prototypes',weeks:'27\u201339'},
  {q:4,name:'Strategy, Leadership & Landing',sub:'Vision, influence, interview range, offer',weeks:'40\u201352'}
];

const WEEKS = [
/* ---------- Q1 ---------- */
{n:1,q:1,t:'First principles of product thinking',type:'strategy',
 topics:['Problem space vs solution space \u2014 and why PMs skip the first','First-principles decomposition: strip a product to user, job, constraint, mechanism','Value equation: user value \u00d7 business value \u00d7 feasibility','The "why now" test \u2014 timing as a product argument'],
 res:[R.swagFull,R.swagFP,sw('first principles')],
 drill:'Take the Bajaj D2C purchase journey you built and decompose it from first principles. Not "we built an e-commerce site" \u2014 what job was the buyer hiring it for, what constraint made it impossible before, what mechanism did you introduce? Write it as if you were pitching it to a VP Product who has never heard of Bajaj.',
 artifact:'Problem Space Map \u2014 D2C premium two-wheeler purchase (1 page: job, constraints, mechanism, why-now, value equation)'},

{n:2,q:1,t:'Continuous discovery & the opportunity tree',type:'discovery',
 topics:['Continuous discovery habits: weekly touchpoints, not quarterly research projects','Opportunity Solution Tree: outcome \u2192 opportunity \u2192 solution \u2192 experiment','Interview technique: past behaviour over hypothetical intent','Assumption mapping: desirability, viability, feasibility, usability'],
 res:[R.swagDisc,ln('continuous discovery'),R.folks],
 drill:'Build an Opportunity Solution Tree for one outcome: "increase online-to-showroom conversion for Chetak". Force yourself to 6+ opportunities before any solution appears. Mark which opportunities you have evidence for and which are guesses.',
 artifact:'Opportunity Solution Tree + assumption map (annotated, evidence-flagged)'},

{n:3,q:1,t:'Customer interviews & research synthesis',type:'discovery',
 topics:['Interview script design: opening, story-mining, laddering, closing','Avoiding leading questions and confirmation bias','Synthesis: affinity mapping \u2192 insight statements \u2192 opportunity backlog','Sample size sanity for qualitative work'],
 res:[sw('user research'),ln('customer interviews'),R.folks],
 drill:'Run 5 real conversations \u2014 EV-curious buyers, a dealer sales exec, someone who abandoned an online booking. 25 minutes each. Then synthesise: what did you believe before, and which belief died?',
 artifact:'Research synthesis note: 5 interviews \u2192 3 insight statements \u2192 2 killed assumptions'},

{n:4,q:1,t:'Metric trees, North Star and counter-metrics',type:'metrics',
 topics:['North Star selection: value exchanged, not vanity volume','Metric tree: NSM \u2192 input metrics \u2192 team-controllable levers','Counter-metrics and guardrails \u2014 what breaks if you win','Leading vs lagging indicators in a long-consideration purchase'],
 res:[ak('north star metric'),ln('metrics'),R.aakashN],
 drill:'Design a metric tree for a D2C EV funnel where purchase cycles run 30\u201390 days. Lagging revenue is useless as a weekly signal \u2014 what are the input metrics you would actually run a sprint against?',
 artifact:'Metric Tree v1 \u2014 NSM, 4 input metrics, 2 counter-metrics, weekly reporting spec'},

{n:5,q:1,t:'SQL foundations \u2014 stop asking analysts',type:'sql',
 topics:['SELECT / WHERE / ORDER BY / LIMIT and reading a schema','Aggregation: GROUP BY, HAVING, COUNT DISTINCT traps','JOINs \u2014 inner vs left, and the fan-out bug that inflates every metric','NULL handling: why your conversion rate is quietly wrong'],
 res:[R.sql1,R.sqlQ,R.mode],
 drill:'Work through the intro tutorial end to end, then solve 10 easy questions. Every query you write, write one sentence above it stating the product question it answers.',
 artifact:'SQL Notebook Part 1 \u2014 10 solved queries, each with the product question it answers'},

{n:6,q:1,t:'Intermediate SQL \u2014 cohorts and windows',type:'sql',
 topics:['CTEs for readable multi-step logic','Window functions: ROW_NUMBER, LAG, running totals','Date arithmetic, cohort bucketing, first-touch vs last-touch','Self-joins for funnel step sequencing'],
 res:[R.sql2,R.sqlQ,R.mode],
 drill:'Write a query that produces a weekly retention cohort table from a raw events table. Then break it deliberately \u2014 introduce a fan-out bug \u2014 and note how the numbers move. That is the skill: knowing when a dashboard is lying.',
 artifact:'SQL Notebook Part 2 \u2014 cohort retention query + funnel step query, annotated'},

{n:7,q:1,t:'Product analytics: funnels, cohorts, retention curves',type:'metrics',
 topics:['Reading a retention curve: does it flatten, and where','Funnel analysis vs step-conversion analysis \u2014 different questions','Segment-first thinking: the average user does not exist','GA4 for a considered purchase: sessions, events, attribution limits'],
 res:[ak('retention'),ln('retention curve'),sw('product analytics')],
 drill:'Pull real GA4 data from your own property. Build the funnel, segment by traffic source and city, and find one segment where the pattern inverts the aggregate. That inversion is your insight.',
 artifact:'Funnel Teardown \u2014 real GA4 data, 3 segments, 1 counter-intuitive finding, 2 recommended experiments'},

{n:8,q:1,t:'Instrumentation & event taxonomy',type:'metrics',
 topics:['Event naming conventions: object-action, properties over event sprawl','Tracking plan as a PM deliverable, not an engineering afterthought','Identity resolution: anonymous \u2192 lead \u2192 customer stitching','Data quality debt \u2014 the silent killer of growth teams'],
 res:[sw('analytics'),ak('instrumentation'),R.mode],
 drill:'Write the tracking plan you wish you had had on day one of the D2C build. Include the identity-stitching logic for the online-to-dealer handoff \u2014 that is the hard part and it is your differentiator.',
 artifact:'Event Tracking Plan \u2014 25 events, properties, identity model, QA checklist'},

{n:9,q:1,t:'PRDs that actually ship',type:'prd',
 topics:['Problem statement, success metrics, non-goals \u2014 in that order','Writing requirements engineers do not have to interpret','Edge cases, failure states, rollout and rollback plans','The one-page PRD vs the full spec \u2014 when each is correct'],
 res:[sw('PRD'),ln('writing product specs'),R.aakashN],
 drill:'Write a PRD for a feature you genuinely wish existed on your current product. Include a "what we are deliberately not doing" section \u2014 senior PMs are judged on what they cut.',
 artifact:'PRD v1 \u2014 problem, metrics, non-goals, requirements, edge cases, rollout'},

{n:10,q:1,t:'Prioritisation & roadmap defence',type:'strategy',
 topics:['RICE, ICE, weighted scoring \u2014 and their failure modes','Opportunity cost framing for exec conversations','Sequencing: dependency chains and compounding bets','Now / Next / Later vs date-committed roadmaps'],
 res:[sw('prioritization'),ln('roadmap'),R.aakashN],
 drill:'Build a 2-quarter roadmap for your current product and then write the rejection memo: the three highest-pressure stakeholder requests you are not doing, and the reasoning. Practise saying no in writing.',
 artifact:'Roadmap + Rejection Memo (the memo is the portfolio piece, not the roadmap)'},

{n:11,q:1,t:'Product sense & app teardowns',type:'teardown',
 topics:['Teardown structure: user \u2192 job \u2192 journey \u2192 friction \u2192 hypothesis \u2192 metric','Judging design intent, not aesthetics','Business model archaeology: how does this product make money','Writing a teardown that reads as strategy, not as a bug list'],
 res:[R.folks,sw('teardown'),R.diego],
 drill:'Tear down one Indian consumer product outside automotive \u2014 Zepto, Cult.fit, MakeMyTrip, or Ather. 90 minutes, no more. End with one experiment you would run in week one if you joined that team.',
 artifact:'Teardown #1 \u2014 publishable, 800\u20131000 words + annotated screens'},

{n:12,q:1,t:'Exec communication & narrative',type:'strategy',
 topics:['BLUF: lead with the decision you want','Structuring a 5-slide exec narrative (situation, complication, options, recommendation, ask)','Handling the hostile question without losing the room','Writing the update nobody has to chase you for'],
 res:[R.swagSec,ln('storytelling'),sw('stakeholder management')],
 drill:'Take your Week 7 funnel finding and turn it into a 5-slide narrative that ends in a specific ask (headcount, budget, or a decision). Time yourself presenting it in 4 minutes.',
 artifact:'Exec Narrative Deck \u2014 5 slides + speaker notes'},

{n:13,q:1,t:'Q1 review \u2014 positioning reset',type:'resume',
 topics:['Audit: which artifacts are portfolio-grade, which are practice','Resume rewrite against the senior-PM bar (scope, ambiguity, judgment)','LinkedIn: headline, About, featured artifacts','Publish artifact #1 publicly and watch what happens'],
 res:[R.swagRoad,R.aakashSite,R.expoPlan],
 drill:'Run your resume through the Artifact Studio with rubric = Resume. Then rewrite every bullet that scores below 4. Publish your best teardown or funnel analysis on LinkedIn with a real point of view in the post body.',
 artifact:'Resume v2 + LinkedIn rewrite + first public post'},

/* ---------- Q2 ---------- */
{n:14,q:2,t:'Growth loops vs funnels',type:'growth',
 topics:['Why funnels leak and loops compound','Loop types: viral, content, paid, sales-led','Mapping input \u2192 action \u2192 output \u2192 reinvestment','Loop maths: cycle time, conversion, amplification'],
 res:[ak('growth loops'),ln('growth loops'),R.aakashN],
 drill:'Draw the growth loop for a considered-purchase category. Two-wheelers do not go viral \u2014 so what is the actual loop? (Hint: look at ownership content, service touchpoints, referral in dealer catchments.)',
 artifact:'Growth Loop Teardown \u2014 loop diagram, cycle-time maths, 3 amplification levers'},

{n:15,q:2,t:'Acquisition & channel economics',type:'growth',

// The artifact sandbox may have no route to the review API. Everything below
// works with zero network so the studio is never a dead end.
let OFF={kind:null,id:null,type:'strategy',title:'',content:''};

function buildRequest(type,title,content){
  const r=RUBRICS[type]||RUBRICS.strategy;
  return `Act as a hiring VP of Product reviewing this artifact against the Senior PM (L3) bar at a Series B/C company in Bengaluru. Be strict; most first drafts sit at 2-3.

ARTIFACT: ${title||'Untitled'}
RUBRIC: ${r.label}
SCORE THESE DIMENSIONS 1-5, in order: ${r.dims.join(', ')}
(3 = competent mid-level PM, 4 = clears the Senior PM bar, 5 = would be shown to a VP as an example)

Return ONLY this JSON, no prose around it:
{"level":"Below bar|At bar|Senior bar","headline":"one blunt sentence","scores":[{"dim":"...","score":0,"why":"one sentence citing something specific"}],"strengths":["..."],"fixes":[{"issue":"...","how":"..."}],"rewrite":"quote one weak passage, then rewrite it to the standard","next":"single highest-leverage next action"}

MY CONTEXT: ${S.profile.context}
TARGET ROLE: ${S.profile.role} in ${S.profile.city}

--- WORK TO REVIEW ---
${content||'(file attached separately)'}`;
}

const WEAK=/\b(worked on|helped with|helped to|assisted|involved in|responsible for|participated|supported the|was part of|contributed to)\b/gi;
const HEDGE=/\b(maybe|might be|sort of|kind of|i think|possibly|hopefully|somewhat|fairly good|quite good)\b/gi;
function localCheck(type,text){
  const t=String(text||''),words=t.trim()?t.trim().split(/\s+/).length:0;
  const nums=(t.match(/\d+(\.\d+)?\s*(%|x|k|cr|lakh|crore|bps)?/gi)||[]).length;
  const weak=(t.match(WEAK)||[]);
  const hedge=(t.match(HEDGE)||[]);
  const heads=(t.match(/^\s*(#{1,4}\s|\d+[.)]\s|[-*\u2022]\s|[A-Z][A-Za-z ]{2,28}:)/gm)||[]).length;
  const metric=/\b(conversion|retention|cohort|funnel|CAC|LTV|north star|counter[- ]metric|baseline|p95|MDE|guardrail|attach rate|payback)\b/i.test(t);
  const nongoal=/\b(non[- ]goal|out of scope|not doing|deliberately not|we will not)\b/i.test(t);
  const decision=/\b(i recommend|my recommendation|i would|therefore|my call|decision:)\b/i.test(t);
  const f=[];
  f.push({ok:words>=250,label:'Depth',detail:words+' words. Portfolio artifacts that hold up in an interview usually run 500\u20131200. Under 250 reads as a summary of thinking rather than the thinking itself.'});
  f.push({ok:nums>=4,label:'Quantification',detail:nums+' numeric claims found. A reviewer scans for numbers first; four or more is the rough floor for a credible analysis.'});
  f.push({ok:weak.length===0,label:'Ownership verbs',detail:weak.length?('Weak verbs found: '+[...new Set(weak.map(w=>w.toLowerCase()))].slice(0,4).join(', ')+'. Replace with what you decided, diagnosed, designed or cut.'):'No hedged ownership verbs. Good \u2014 you are claiming your decisions.'});
  const hedgeAllow=Math.floor(words/300); // one hedge per ~300 words is human; more reads as unsure
  f.push({ok:hedge.length<=hedgeAllow,label:'Conviction',detail:hedge.length?(hedge.length+' hedging phrase'+(hedge.length>1?'s':'')+' ('+[...new Set(hedge.map(h=>h.toLowerCase()))].slice(0,3).join(', ')+'). Senior writing states a position and then names the risk, rather than pre-softening every claim.'):'No hedging language.'});
  f.push({ok:heads>=4,label:'Structure',detail:heads+' headings or list markers. A reviewer reads in 90 seconds; unstructured prose loses them before the insight lands.'});
  f.push({ok:metric,label:'Metric literacy',detail:metric?'Metric vocabulary present.':'No metric vocabulary detected. Almost every rubric here scores metric closure \u2014 name the measure and the counter-measure.'});
  f.push({ok:decision,label:'Recommendation',detail:decision?'A recommendation is stated.':'No explicit recommendation found. Analysis without a call is the single most common reason a strong candidate reads as mid-level.'});
  if(type==='prd'||type==='strategy')f.push({ok:nongoal,label:'Scope cuts',detail:nongoal?'Non-goals are stated.':'No non-goals or scope cuts. What you refuse to build is the clearest seniority signal in a spec.'});
  return f;
}
function localBlock(type,text){
  const f=localCheck(type,text),pass=f.filter(x=>x.ok).length;
  return `<div class="wksec"><div class="kicker">Mechanical check \u00b7 ${pass}/${f.length} clear (runs locally, no network)</div>
    ${f.map(x=>`<div class="box ${x.ok?'green':''}" style="margin-bottom:6px;border-left-color:var(--${x.ok?'green':'red'})"><b>${x.ok?'\u2713':'\u2717'} ${esc(x.label)}</b><br>${esc(x.detail)}</div>`).join('')}</div>`;
}

/* ============ SCORECARD ============ */
function scorecard(r){
  if(!r)return'';
  if(!r.scores)return `<div class="panel" style="background:#101720"><div class="row sp"><span class="verdict">Written review</span>${r.src?`<span class="chip">${esc(r.src)}</span>`:''}</div><div class="box" style="white-space:pre-wrap;margin-top:10px">${esc(r.text||'')}</div></div>`;
  const lv=r.level||'', col=lv.includes('Senior')?'green':lv.includes('At')?'gold':'red';
  return `<div class="panel" style="background:#101720">
    <div class="row sp"><span class="verdict" style="color:var(--${col==='green'?'green':col==='gold'?'gold':'red'})">${esc(lv)}</span><div class="row">${r.src?`<span class="chip">${esc(r.src)}</span>`:''}<span class="chip ${col}">avg ${(r.scores.reduce((a,b)=>a+(+b.score||0),0)/r.scores.length).toFixed(1)}/5</span></div></div>
    <p style="margin:8px 0 16px;font-size:13.5px">${esc(r.headline||'')}</p>
    ${r.scores.map(s=>`<div class="sc"><span class="dim">${esc(s.dim)}</span><span class="bar"><i style="width:${(+s.score||0)*20}%"></i></span><span class="v">${esc(s.score)}/5</span></div><div class="tiny muted" style="margin:-2px 0 9px 160px">${esc(s.why||'')}</div>`).join('')}
    ${r.strengths&&r.strengths.length?`<div class="wksec"><div class="kicker">Holds up</div><ul class="t">${r.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    ${r.fixes&&r.fixes.length?`<div class="wksec"><div class="kicker">Fix before this goes public</div>${r.fixes.map(f=>`<div class="box red" style="margin-bottom:7px;border-left-color:var(--red)"><b>${esc(f.issue)}</b><br>${esc(f.how)}</div>`).join('')}</div>`:''}
    ${r.rewrite?`<div class="wksec"><div class="kicker">What better looks like</div><div class="box gold" style="white-space:pre-wrap">${esc(r.rewrite)}</div></div>`:''}
    ${r.next?`<div class="wksec"><div class="kicker">Next move</div><div class="box green">${esc(r.next)}</div></div>`:''}
  </div>`;
}

/* ============ BIND ============ */
function bind(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    const a=el.dataset.act;
    if(el.tagName==='SELECT'||el.tagName==='INPUT'&&a!=='pick'){el.onchange=()=>act(a,el);return;}
    el.onclick=()=>act(a,el);
  });
  const f=$('#aFile');if(f)f.onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);};
  const imp=$('#impFile');if(imp)imp.onchange=e=>doImport(e.target.files[0]);
  const ci=$('#cIn');if(ci)ci.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();act('send');}};
  document.querySelectorAll('input[type=range][id^=ss]').forEach(r=>{
    r.oninput=()=>{const l=document.getElementById('sv'+r.id.slice(2));if(l)l.textContent=r.value;};
  });
  const ch=$('#chat');if(ch)ch.scrollTop=ch.scrollHeight;
}

async function act(a,el){
  const d=el?el.dataset:{};
  switch(a){
    case 'qtab': QTAB=+d.q; render(); break;
    case 'togw': OPEN=(OPEN===+d.w?null:+d.w); render(); break;
    case 'mark': {const n=+d.w;S.weeks[n]=S.weeks[n]||{};S.weeks[n].done=!S.weeks[n].done;save();render();break;}
    case 'goweek': PAGE='plan';QTAB=WEEKS.find(w=>w.n===+d.w).q;OPEN=+d.w;render();break;
    case 'goplan': PAGE='plan';render();break;
    case 'build': {const w=WEEKS.find(x=>x.n===+d.w);STUDIO={title:w.artifact.split('\u2014')[0].trim()+' (W'+w.n+')',type:w.type,week:String(w.n),body:''};PAGE='studio';render();break;}
    case 'pick': $('#aFile').click(); break;
    case 'clearfile': PENDING=null; render(); break;
    case 'review': await doReview(); break;
    case 'case': vCase(d.c); break;
    case 'backcases': PAGE='cases'; render(); break;
    case 'savecase': {const c=d.c;S.cases[c]=S.cases[c]||{};S.cases[c].answer=$('#cAns').value;save();toast('Draft saved.');break;}
    case 'gradecase': await gradeCase(d.c); break;
    case 'tostudio': {const c=CASES.find(x=>x.id===d.c);const st=S.cases[d.c]||{};STUDIO={title:'Case: '+c.title,type:c.type,week:String(c.week),body:st.answer||$('#cAns').value};PAGE='studio';render();break;}
    case 'status': {const x=S.artifacts.find(y=>y.id===d.id);x.status=el.value;save();break;}
    case 'delart': {S.artifacts=S.artifacts.filter(y=>y.id!==d.id);save();render();break;}
    case 'viewart': {const x=S.artifacts.find(y=>y.id===d.id);$('#pOut').innerHTML=`<div class="panel"><div class="row sp"><h2 style="margin:0">${esc(x.title)}</h2><span class="pill">${esc(x.status)}</span></div><div class="field" style="margin-top:12px"><label class="f">Public link (optional)</label><input data-act="setlink" data-id="${x.id}" value="${esc(x.link||'')}" placeholder="https://linkedin.com/posts/\u2026"></div><div class="box" style="white-space:pre-wrap;max-height:280px;overflow:auto">${esc((x.content||'').slice(0,3000))||'(file-based artifact)'}</div>${x.review?scorecard(x.review):''}</div>`;bind();break;}
    case 'setlink': {const x=S.artifacts.find(y=>y.id===d.id);x.link=el.value;save();break;}
    case 'hook': await makeHook(d.id); break;
    case 'drill': openDrill(d.q); break;
    case 'gradedrill': await gradeDrill(d.q); break;
    case 'addapp': S.apps.push({id:uid(),co:prompt('Company')||'\u2014',role:prompt('Role')||'Senior PM',stage:'Researching',note:''});save();render();break;
    case 'appstage': {const x=S.apps.find(y=>y.id===d.id);x.stage=el.value;save();break;}
    case 'appnote': {const x=S.apps.find(y=>y.id===d.id);x.note=el.value;save();break;}
    case 'delapp': S.apps=S.apps.filter(y=>y.id!==d.id);save();render();break;
    case 'send': await sendChat($('#cIn').value); break;
    case 'quick': await sendChat(d.p); break;
    case 'saveprofile': S.profile={name:$('#pName').value,start:$('#pStart').value,role:$('#pRole').value,city:$('#pCity').value,context:$('#pCtx').value};save();toast('Profile saved.');render();break;
    case 'copyreq': {const t=buildRequest(OFF.type,OFF.title,OFF.content);copyText(t);break;}
    case 'copyreqstudio': {
      syncStudio();
      if(!STUDIO.body.trim()){toast('Paste the work first \u2014 the request needs content to carry.');return;}
      copyText(buildRequest(STUDIO.type,STUDIO.title,STUDIO.body));break;}
    case 'copyreqraw': copyText($('#hookReq').textContent); break;
    case 'dlreq': {const t=buildRequest(OFF.type,OFF.title,OFF.content);const b=new Blob([t],{type:'text/markdown'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='review-request.md';u.click();toast('Downloaded \u2014 attach it in chat.');break;}
    case 'pastesave': {
      const raw=$('#pasteBack').value.trim(); if(!raw){toast('Nothing pasted.');return;}
      let rev; try{rev=jparse(raw);rev.scoreAvg=avgOf(rev);rev.src='coach review';}
      catch(e){rev={text:raw,src:'coach review'};}
      attachReview(rev);toast('Review saved.');
      const host=$('#rOut')||$('#cOut')||$('#dRes'); if(host){host.innerHTML=scorecard(rev);}
      break;}
    case 'saveself': {
      const r=RUBRICS[OFF.type]||RUBRICS.strategy;
      const scores=r.dims.map((d,i)=>({dim:d,score:+($('#ss'+i)||{value:3}).value,why:'self-assessed'}));
      const avg=+(scores.reduce((a,b)=>a+b.score,0)/scores.length).toFixed(1);
      const rev={level:avg>=4?'At bar':'Below bar',headline:'Self-assessment \u2014 replace with a coach review before publishing.',scores:scores,src:'self-score',scoreAvg:avg,fixes:[],strengths:[]};
      attachReview(rev);toast('Self-score saved.');
      const host=$('#rOut')||$('#cOut')||$('#dRes'); if(host){host.innerHTML=scorecard(rev);}
      break;}
    case 'saveonly': {const a=saveArtifact();toast('Saved to portfolio as a draft.');PAGE='portfolio';render();break;}
    case 'export': doExport(); break;
    case 'import': $('#impFile').click(); break;
    case 'reset': if(confirm('Delete all progress, artifacts and reviews?')){S=JSON.parse(JSON.stringify(DEFAULT));save();render();} break;
  }
}

/* ============ ACTIONS ============ */
async function readFile(f){
  if(!f)return;
  toast('Extracting text from '+f.name+'\u2026');
  const fd=new FormData(); fd.append('file',f);
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    syncStudio();
    STUDIO.body=d.text; if(!STUDIO.title)STUDIO.title=d.name;
    PENDING={name:d.name,words:d.words,id:d.id};
    render(); toast(d.words.toLocaleString()+' words extracted from '+d.name+'.');
  }catch(e){toast('Could not read that file: '+e.message);}
}
function attachBlocks(){return[];}
function saveArtifact(){ // never lose the work, review or not
  syncStudio();
  const art={id:uid(),title:STUDIO.title||'Untitled artifact',type:STUDIO.type,week:STUDIO.week,status:'Draft',
    content:STUDIO.body,file:PENDING?PENDING.name:'',score:null,review:null,link:'',ts:Date.now()};
  S.artifacts.push(art);save();return art;
}
async function doReview(){
  if(BUSY)return; syncStudio();
  if(!STUDIO.body.trim()&&!PENDING){toast('Paste the work or attach a file first.');return;}
  const art=saveArtifact();
  BUSY=true;$('#rOut').innerHTML='<div class="typing">Reviewing against the '+esc(RUBRICS[STUDIO.type].label)+' rubric\u2026</div>';
  try{
    const r=await runReview(STUDIO.type,STUDIO.body);
    r.scoreAvg=r.scoreAvg||avgOf(r);
    art.review=r;art.score=r.scoreAvg;art.status=r.scoreAvg>=4?'Reviewed':'Draft';save();
    $('#rOut').innerHTML=scorecard(r)+'<div class="row" style="margin-top:10px"><span class="chip green">saved to portfolio</span></div>';
    STUDIO={title:'',type:STUDIO.type,week:'',body:''};PENDING=null; // form resets for the next artifact
  }catch(e){
    if(e.offline)$('#rOut').innerHTML=offlinePanel('artifact',art.id,STUDIO.type,STUDIO.title,STUDIO.body);
    else $('#rOut').innerHTML='<div class="box" style="border-left-color:var(--red)">Review failed: '+esc(e.message)+'. The artifact is saved in your portfolio either way.</div>'+offlinePanel('artifact',art.id,STUDIO.type,STUDIO.title,STUDIO.body);
    bind();
  }
  BUSY=false;
}
async function gradeCase(id){
  if(BUSY)return;
  const c=CASES.find(x=>x.id===id), ans=$('#cAns').value;
  if(!ans.trim()){toast('Write your answer first.');return;}
  S.cases[id]=S.cases[id]||{};S.cases[id].answer=ans;save();
  BUSY=true;$('#cOut').innerHTML='<div class="typing">Grading against the hiring bar\u2026</div>';
  try{
    const body='CASE: '+c.title+'\nCONTEXT: '+c.context+'\nQUESTION: '+c.prompt+'\n\nCANDIDATE ANSWER:\n'+ans;
    const r=await runReview('case',body);
    r.scoreAvg=r.scoreAvg||avgOf(r);
    S.cases[id].review=r;save();
    $('#cOut').innerHTML=scorecard(r);
  }catch(e){
    const body='CASE: '+c.title+'\nQUESTION: '+c.prompt+'\n\nMY ANSWER:\n'+ans;
    $('#cOut').innerHTML=(e.offline?'':'<div class="box" style="border-left-color:var(--red)">Grading failed: '+esc(e.message)+'</div>')+offlinePanel('case',id,'case',c.title,body);
    bind();
  }
  BUSY=false;
}
function openDrill(q){
  $('#dOut').innerHTML=`<div class="panel"><h2>${esc(q)}</h2>
    <textarea id="dAns" rows="10" placeholder="Answer as you would out loud. Clarify, structure, go deep on one branch, close with metrics."></textarea>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="gradedrill" data-q="${esc(q)}">Grade this answer</button></div>
    <div id="dRes" style="margin-top:14px"></div></div>`;
  bind();$('#dAns').focus();
}
async function gradeDrill(q){
  if(BUSY)return;const ans=$('#dAns').value;if(!ans.trim()){toast('Write an answer first.');return;}
  BUSY=true;$('#dRes').innerHTML='<div class="typing">Grading\u2026</div>';
  try{const r=await runReview('interview','QUESTION: '+q+'\n\nANSWER:\n'+ans);$('#dRes').innerHTML=scorecard(r);}
  catch(e){$('#dRes').innerHTML=(e.offline?'':'<div class="box">Failed: '+esc(e.message)+'</div>')+offlinePanel('drill',null,'interview',q,'QUESTION: '+q+'\n\nMY ANSWER:\n'+ans);bind();}
  BUSY=false;
}
async function makeHook(id){
  if(BUSY)return;const x=S.artifacts.find(y=>y.id===id);
  BUSY=true;$('#pOut').innerHTML='<div class="typing">Writing the post\u2026</div>';
  try{
    const t=(await api('/api/ai/hook',{title:x.title,content:x.content||'',profile:profilePayload()})).text;
    $('#pOut').innerHTML='<div class="panel"><div class="row sp"><h2 style="margin:0">Draft post \u00b7 '+esc(x.title)+'</h2><button class="btn sm" data-act="copyhook">Copy</button></div><div class="box" id="hookTxt" style="white-space:pre-wrap;margin-top:10px">'+esc(t)+'</div></div>';
    bind();
    const cb=document.querySelector('[data-act="copyhook"]');if(cb)cb.onclick=()=>{navigator.clipboard.writeText(t);toast('Copied.');};
  }catch(e){
    const req='Write a LinkedIn post for this artifact. 120-180 words, open with a specific claim or number, no emojis, no "excited to share", max 2 hashtags, end with a question that invites disagreement.\n\nARTIFACT: '+x.title+'\nCONTENT:\n'+(x.content||'').slice(0,4000);
    $('#pOut').innerHTML='<div class="panel"><div class="row sp"><h2 style="margin:0">Post draft \u00b7 two-step mode</h2><span class="chip gold">no API route</span></div><p class="tiny muted" style="margin:8px 0 12px">Copy this into your chat with Claude and it will come back written.</p><div class="box" style="white-space:pre-wrap;max-height:200px;overflow:auto" id="hookReq">'+esc(req)+'</div><button class="btn pri" style="margin-top:10px" data-act="copyreqraw">Copy request</button></div>';
    bind();
  }
  BUSY=false;
}
async function sendChat(t){
  if(BUSY||!t||!t.trim())return;
  S.chat.push({r:'u',c:t.trim()});save();
  const ci=$('#cIn');if(ci)ci.value='';
  $('#chat').innerHTML=S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.c)}</div>`).join('')+'<div class="msg a typing">thinking\u2026</div>';
  $('#chat').scrollTop=9e9;BUSY=true;
  try{
    const out=(await api('/api/ai/chat',{messages:S.chat.slice(-12),profile:profilePayload(),week:String(curWeek()||'pre-launch')})).text;
    S.chat.push({r:'a',c:out});save();
  }catch(e){
    S.chat.push({r:'a',c:e.offline
      ? (e.nokey?'The server is running but has no ANTHROPIC_API_KEY set. Add it to .env and restart \u2014 then this coach runs on '+(HEALTH.model||'Opus')+'.':'The server is not responding. Start it with npm start, then try again.')
      : 'Connection failed: '+e.message});
  }
  BUSY=false;
  $('#chat').innerHTML=S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.c)}</div>`).join('');
  $('#chat').scrollTop=9e9;
}
function doExport(){window.open('/api/export','_blank');toast('Backup downloading \u2014 the server also snapshots hourly.');}
function doImport(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(rd.result));save();render();toast('Restored.');}catch(e){toast('That file could not be read.');}};
  rd.readAsText(f);
}

/* ============ BOOT ============ */
// debug handle: lets you inspect or repair state from the console
window.OS={get state(){return S;},WEEKS:WEEKS,CASES:CASES,RUBRICS:RUBRICS,localCheck:localCheck,buildRequest:buildRequest,render:render,save:save};
(async()=>{await load();render();})();

</script>
